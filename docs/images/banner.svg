<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="Syntactica — neural protocol grammar for DNS">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c86ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#9c86ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="12%" r="60%">
      <stop offset="0" stop-color="#6d4aff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="90%" r="55%">
      <stop offset="0" stop-color="#12a594" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#12a594" stop-opacity="0"/>
    </radialGradient>
    <style>
      .tok { fill:#15151f; stroke:#2a2a3d; }
      .tl { fill:#cfc9ff; font-size:16px; }
      @keyframes sweep { 0%{transform:translateX(0)} 100%{transform:translateX(560px)} }
      @keyframes flip { 0%,42%{opacity:1} 50%,92%{opacity:0} 100%{opacity:1} }
      @keyframes flip2 { 0%,42%{opacity:0} 50%,92%{opacity:1} 100%{opacity:0} }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      .scan { animation: sweep 3.2s ease-in-out infinite alternate; }
      .ok { animation: flip 6.4s steps(1) infinite; }
      .bad { animation: flip2 6.4s steps(1) infinite; }
      .p { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#0b0b13"/>
  <rect width="1200" height="340" fill="url(#glow1)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>

  <!-- wordmark -->
  <g transform="translate(70,96)">
    <rect x="0" y="-42" width="56" height="56" rx="15" fill="url(#brand)"/>
    <text x="28" y="0" text-anchor="middle" font-size="34" font-weight="800" fill="#0b0b13">S</text>
    <text x="80" y="6" font-size="56" font-weight="800" fill="url(#brand)" letter-spacing="1">Syntactica</text>
    <text x="82" y="46" font-size="19" fill="#a6a6c0">Neural protocol grammar for DNS</text>
    <text x="82" y="78" font-size="15" fill="#6e6e8c">Every protocol is a grammar &#8212; learn the rules, catch what breaks them.</text>
  </g>

  <!-- animated tokenisation + verdict -->
  <g transform="translate(70,238)">
    <text x="0" y="-6" class="tl" fill="#6e6e8c" font-size="13">tokenising a DNS query&#8230;</text>
    <g>
      <rect class="tok" x="0" y="6" width="70" height="30" rx="8"/><text x="35" y="26" class="tl" text-anchor="middle">QR=0</text>
      <rect class="tok" x="88" y="6" width="70" height="30" rx="8"/><text x="123" y="26" class="tl" text-anchor="middle">QT=A</text>
      <rect class="tok" x="176" y="6" width="84" height="30" rx="8"/><text x="218" y="26" class="tl" text-anchor="middle">LEN=m</text>
      <rect class="tok" x="258" y="6" width="216" height="30" rx="8"/><text x="366" y="26" class="tl" text-anchor="middle">w w w &#183; e x a m p l e</text>
      <rect class="tok" x="490" y="6" width="76" height="30" rx="8"/><text x="528" y="26" class="tl" text-anchor="middle">&lt;root&gt;</text>
      <!-- scanning highlight -->
      <rect class="scan" x="0" y="4" width="72" height="34" rx="8" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    </g>
  </g>

  <!-- verdict badges (flip between conforms / violation) -->
  <g transform="translate(980,150)">
    <g class="ok">
      <rect x="0" y="0" width="170" height="54" rx="14" fill="#103a37" stroke="#2dd4bf"/>
      <text x="20" y="34" font-size="22" font-weight="800" fill="#2dd4bf">&#10003; CONFORMS</text>
    </g>
    <g class="bad">
      <rect x="0" y="0" width="170" height="54" rx="14" fill="#3a1618" stroke="#ff6369"/>
      <text x="18" y="34" font-size="22" font-weight="800" fill="#ff6369">&#9888; VIOLATION</text>
    </g>
    <circle class="p" cx="85" cy="82" r="4" fill="#9c86ff"/>
  </g>

  <!-- capability strip -->
  <text x="1150" y="252" text-anchor="end" font-size="12" fill="#8a8aa0">detect &#183; explain &#183; guarantee &#183; respond &#183; verify &#183; fuzz &#183; self-learn</text>
</svg>
